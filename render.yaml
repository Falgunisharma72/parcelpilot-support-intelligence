# Render blueprint - free tier, no card required.
#   1. Push this repo to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick the repo.
#   3. Paste a model key when prompted. Any ONE of the keys below is enough and
#      all of them have a free tier - GROQ_API_KEY is the recommended default.
#      They are marked sync:false, so nothing is ever committed.
services:
  - type: web
    name: parcelpilot-support
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
